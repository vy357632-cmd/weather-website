<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .emoji {
            font-size: 55px;
        }

        #temperature {
            font-size: 50px;
            font-weight: bold;
            margin: 10px;
        }

        #time {
            font-size: 35px;
            font-weight: bold;
            margin: 20px 0;
        }

        .location-text {
            font-size: 16px;
            line-height: 1.8;
        }

        button {
            border: 0;
            padding: 13px 20px;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #7dd3fc;
        }

        .map {
            grid-column: 1 / -1;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 0;
            border-radius: 15px;
        }

        #status {
            margin-top: 15px;
            color: #bae6fd;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .map {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌎 My Weather Dashboard</h1>

    <div class="cards">

        <!-- WEATHER -->
        <div class="card">
            <h2>🌤️ Weather</h2>

            <div class="emoji" id="weatherIcon">🌤️</div>

            <div id="temperature">--°C</div>

            <p id="weatherDescription">
                Location select karo
            </p>
        </div>


        <!-- TIME -->
        <div class="card">
            <h2>🕐 Current Time</h2>

            <div id="time">--:--:--</div>

            <p>Local Time</p>
        </div>


        <!-- LOCATION -->
        <div class="card">
            <h2>📍 Location</h2>

            <div class="location-text">
                <p>
                    <b>Latitude:</b>
                    <span id="latitude">--</span>
                </p>

                <p>
                    <b>Longitude:</b>
                    <span id="longitude">--</span>
                </p>

                <p>
                    <b>City:</b>
                    <span id="city">--</span>
                </p>
            </div>

            <button onclick="findLocation()">
                📍 Find My Location
            </button>
        </div>


        <!-- MAP -->
        <div class="card map">
            <h2>🗺️ My Map</h2>

            <iframe
                id="map"
                src="https://www.openstreetmap.org/export/embed.html?bbox=77.0%2C28.0%2C78.0%2C29.0&layer=mapnik">
            </iframe>

            <p id="status">
                Location button dabao.
            </p>
        </div>

    </div>
</div>


<script>

    // -------------------------
    // LIVE TIME
    // -------------------------

    function updateTime() {

        let now = new Date();

        let hours = String(now.getHours()).padStart(2, "0");
        let minutes = String(now.getMinutes()).padStart(2, "0");
        let seconds = String(now.getSeconds()).padStart(2, "0");

        document.getElementById("time").innerText =
            hours + ":" + minutes + ":" + seconds;
    }

    updateTime();
    setInterval(updateTime, 1000);


    // -------------------------
    // FIND LOCATION
    // -------------------------

    function findLocation() {

        let status = document.getElementById("status");

        status.innerText = "📍 Location find ho rahi hai...";

        if (!navigator.geolocation) {

            status.innerText =
                "❌ Aapka browser location support nahi karta.";

            return;
        }

        navigator.geolocation.getCurrentPosition(

            function(position) {

                let lat = position.coords.latitude;
                let lon = position.coords.longitude;

                document.getElementById("latitude").innerText =
                    lat.toFixed(5);

                document.getElementById("longitude").innerText =
                    lon.toFixed(5);

                status.innerText =
                    "✅ Location mil gayi! Weather load ho raha hai...";


                // MAP UPDATE

                let mapURL =
                    "https://www.openstreetmap.org/export/embed.html" +
                    "?bbox=" +
                    (lon - 0.05) + "%2C" +
                    (lat - 0.05) + "%2C" +
                    (lon + 0.05) + "%2C" +
                    (lat + 0.05) +
                    "&layer=mapnik" +
                    "&marker=" +
                    lat + "%2C" + lon;

                document.getElementById("map").src = mapURL;


                // WEATHER

                getWeather(lat, lon);


                // CITY NAME

                getCity(lat, lon);
            },

            function(error) {

                if (error.code === 1) {

                    status.innerText =
                        "❌ Location permission denied. Browser mein Allow karo.";

                } else if (error.code === 2) {

                    status.innerText =
                        "❌ Location available nahi hai.";

                } else if (error.code === 3) {

                    status.innerText =
                        "❌ Location request timeout.";

                } else {

                    status.innerText =
                        "❌ Location find nahi ho payi.";
                }
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }


    // -------------------------
    // WEATHER
    // -------------------------

    function getWeather(lat, lon) {

        let url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + lat +
            "&longitude=" + lon +
            "&current=temperature_2m,weather_code" +
            "&timezone=auto";


        fetch(url)

        .then(function(response) {

            if (!response.ok) {
                throw new Error("Weather API error");
            }

            return response.json();
        })

        .then(function(data) {

            let temperature =
                data.current.temperature_2m;

            let code =
                data.current.weather_code;


            document.getElementById("temperature").innerText =
                temperature + "°C";


            let result = weatherText(code);

            document.getElementById("weatherIcon").innerText =
                result.icon;

            document.getElementById("weatherDescription").innerText =
                result.text;


            document.getElementById("status").innerText =
                "✅ Weather successfully loaded!";
        })

        .catch(function(error) {

            console.log(error);

            document.getElementById("weatherDescription").innerText =
                "Weather load nahi ho paaya.";

            document.getElementById("status").innerText =
                "❌ Internet check karo.";
        });
    }


    // -------------------------
    // WEATHER DESCRIPTION
    // -------------------------

    function weatherText(code) {

        if (code === 0) {
            return {
                icon: "☀️",
                text: "Clear Sky"
            };
        }

        if (code >= 1 && code <= 3) {
            return {
                icon: "🌤️",
                text: "Partly Cloudy"
            };
        }

        if (code >= 45 && code <= 48) {
            return {
                icon: "🌫️",
                text: "Foggy"
            };
        }

        if (code >= 51 && code <= 67) {
            return {
                icon: "🌧️",
                text: "Rain"
            };
        }

        if (code >= 71 && code <= 77) {
            return {
                icon: "❄️",
                text: "Snow"
            };
        }

        if (code >= 80 && code <= 82) {
            return {
                icon: "🌦️",
                text: "Rain Showers"
            };
        }

        if (code >= 95) {
            return {
                icon: "⛈️",
                text: "Thunderstorm"
            };
        }

        return {
            icon: "🌤️",
            text: "Weather"
        };
    }


    // -------------------------
    // CITY NAME
    // -------------------------

    function getCity(lat, lon) {

        let url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=json" +
            "&lat=" + lat +
            "&lon=" + lon;

        fetch(url)

        .then(function(response) {
            return response.json();
        })

        .then(function(data) {

            if (data.address) {

                let city =
                    data.address.city ||
                    data.address.town ||
                    data.address.village ||
                    data.address.state ||
                    "Unknown";

                document.getElementById("city").innerText =
                    city;
            }
        })

        .catch(function() {

            document.getElementById("city").innerText =
                "Location found";
        });
    }


    // Automatically ask for location
    findLocation();

</script>

</body>
</html>
